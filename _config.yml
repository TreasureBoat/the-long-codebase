# The Long Codebase — site settings
#
# NOTE: this file is NOT reloaded by `bundle exec jekyll serve`. Restart after editing.

# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------

title: The Long Codebase
email: k.ishimoto@treasureboat.org
description: >- # ignore newlines until the next key
  Two developers, one twenty-year-old codebase, and an AI. Notes from real work on
  long-lived production systems — the kind of code most companies actually have,
  rather than the greenfield demo everybody writes about.

# ---------------------------------------------------------------------------
# URLs
# ---------------------------------------------------------------------------
#
# This is a PROJECT page (treasureboat.github.io/the-long-codebase), not a user page,
# so baseurl MUST be the repository name. Leave it empty and every stylesheet, link and
# image resolves to the wrong path — the site renders unstyled with broken navigation
# and looks broken rather than misconfigured.
#
# If a custom domain is added later: set url to that domain and baseurl back to "".

baseurl: "/the-long-codebase"
url: "https://treasureboat.github.io"

github_username: treasureboat

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------
#
# The build server runs in UTC. Without these, a post dated in a timezone ahead of it
# counts as "in the future" and is silently left out of the build - the post simply does
# not appear, with no error. This blog has authors in two timezones, so it is more
# exposed to that, not less.

timezone: Asia/Tokyo
future: true

# Show post intros on the home page rather than a bare list of titles.
show_excerpts: true

# Nav order. Without this minima orders pages however it finds them.
header_pages:
  - about.md
  - work.md

# ---------------------------------------------------------------------------
# Post defaults
# ---------------------------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - CLAUDE.md
  - .githooks/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .idea/
  - README.md
