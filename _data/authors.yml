# Bylines. Referenced from a post's front matter as `author: ken`.
# The contrast between the two voices is the point of this blog, so every post says
# plainly who is writing and why they are worth listening to on it.

ken:
  name: Ken Ishimoto
  email: k.ishimoto@treasureboat.org
  role: >-
    Self-taught since 1988. Reverse-engineered a discontinued closed-source framework by
    hand rather than abandon fifteen years of work, and maintains what came out of it.
    Was the skeptic.

paul:
  name: Paul Yu
  email: paul.yu@green-orchid-llc.com
  role: >-
    A business-oriented program manager who can actually program. Built and has run the same
    production SaaS for fifteen years — most of its features, all of its support email. Knows
    the domain better than the language. Was the AI novice.
